<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root { --bg: #0a0a0a; --fg: #f5f5f5; }
  @media (prefers-color-scheme: light) {
    :root { --bg: #f4f4f5; --fg: #111111; }
  }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; user-select: none; }
  .bar {
    height: 36px; display: flex; align-items: center; padding-left: 14px;
    color: var(--fg); font: 700 14px/1 system-ui, 'Segoe UI', sans-serif;
    -webkit-app-region: drag;
  }
</style>
</head>
<body><div class="bar"><img src="build/icon.png" width="18" height="18" style="margin-right:8px">Tinywatch</div></body>
</html>
