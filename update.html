<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root { --bg: #0a0a0a; --fg: #f5f5f5; --muted: #a1a1aa; --border: #27272a; --btn: #18181b; --accent: #f97316; }
  @media (prefers-color-scheme: light) {
    :root { --bg: #f4f4f5; --fg: #111111; --muted: #52525b; --border: #d4d4d8; --btn: #e4e4e7; }
  }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); overflow: hidden; user-select: none; }
  body {
    box-sizing: border-box; border: 1px solid var(--border);
    display: flex; flex-direction: column; padding: 20px 22px 18px;
    font: 14px/1.4 system-ui, 'Segoe UI', sans-serif;
    -webkit-app-region: drag;
  }
  .head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  h1 { margin: 0; font-size: 16px; font-weight: 700; }
  p { margin: 0; color: var(--muted); }
  .actions { margin-top: auto; display: flex; justify-content: flex-end; gap: 8px; -webkit-app-region: no-drag; }
  button {
    font: 600 13px/1 inherit; font-family: inherit; padding: 9px 16px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--btn); color: var(--fg); cursor: pointer;
  }
  button:hover { filter: brightness(1.15); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>
  <div class="head"><img src="build/icon.png" width="22" height="22"><h1>Update ready</h1></div>
  <p id="msg">A new version of Tinywatch has been downloaded. Restart to finish installing it.</p>
  <div class="actions">
    <button id="later">Later</button>
    <button id="restart" class="primary" autofocus>Restart now</button>
  </div>
<script>
  const version = new URLSearchParams(location.search).get('v');
  if (version) document.getElementById('msg').textContent =
    `Tinywatch ${version} has been downloaded. Restart to finish installing it.`;
  document.getElementById('restart').onclick = () => window.updateDialog.choose('restart');
  document.getElementById('later').onclick = () => window.updateDialog.choose('later');
  addEventListener('keydown', (e) => { if (e.key === 'Escape') window.updateDialog.choose('later'); });
</script>
</body>
</html>
